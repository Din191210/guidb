[package]
name = "guidb-server"
version.workspace = true
edition.workspace = true

[dependencies]
guidb-shared = { path = "../guidb-shared" }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
leptos = { version = "0.8.23", features = ["ssr"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql-rsa", "sqlite", "postgres", "mysql", "chrono", "uuid", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tower-http = { version = "0.6.11", features = ["fs", "trace"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
async-trait = "0.1.92"
dashmap = "6.2.1"
sha2 = "0.10.9"
hex = "0.4.3"

base64 = "0.23"
subtle = "2.6"

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
